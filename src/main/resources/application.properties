spring.application.name=AutoManager
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL — valores definidos em application-local.properties (dev) ou variáveis de ambiente (prod)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway — única fonte de verdade para o schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# OpenAPI / Swagger UI — fonte de verdade da documentação da API
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JJwt - Valores de configuração do token
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TTL:1h}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:1d}
app.security.jwt.issuer=${JWT_ISSUER:automanager}